; =============================================================================
;  NODE 1 (F1) · Saha sensör düğümü · ESP32-S (NodeMCU-32S / ESP-WROOM-32 kart)
;  Derle + yükle :  pio run -t upload        (port otomatik bulunur)
;  Port seçmek   :  pio run -t upload --upload-port /dev/ttyUSB0   (Windows: COM5)
;  Seri monitör  :  pio device monitor
;  Not: Yüklerken pilleri ÇIKARIN; kart USB'den beslensin.
; =============================================================================
[env:node1]
platform        = espressif32@^6.4.0
board           = esp32dev              ; ESP-32S / NodeMCU-32S için genel ESP32 tanımı
framework       = arduino
monitor_speed   = 115200
upload_speed    = 460800                ; yükleme hata verirse 115200 yapın
monitor_filters = esp32_exception_decoder
build_flags     = -DCORE_DEBUG_LEVEL=0
lib_deps =
    nrf24/RF24@^1.4.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
