; =============================================================================
;  NODE 2 (F2) · Köprü / gateway · ESP32 DEVKIT V1 (DOIT, 30 pin)
;  Derle + yükle :  pio run -t upload        (port otomatik bulunur)
;  Port seçmek   :  pio run -t upload --upload-port /dev/ttyUSB0   (Windows: COM5)
;  Seri monitör  :  pio device monitor       (komut deneyin: status, test 1)
;  Not: Simülasyon sunucusu çalışırken seri monitörü KAPATIN (port tek programa açılır).
; =============================================================================
[env:node2]
platform        = espressif32@^6.4.0
board           = esp32doit-devkit-v1
framework       = arduino
monitor_speed   = 115200
monitor_echo    = yes
monitor_eol     = LF
upload_speed    = 460800                ; yükleme hata verirse 115200 yapın
monitor_filters = esp32_exception_decoder
build_flags     = -DCORE_DEBUG_LEVEL=0
lib_deps =
    nrf24/RF24@^1.4.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
